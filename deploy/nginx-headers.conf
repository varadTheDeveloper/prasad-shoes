# Security headers for the website pages (installed as /etc/nginx/snippets/prasad-shoes-headers.conf).
# Included inside every nginx "location" that has its own add_header: nginx forgets the server-level
# add_header lines in such a location, which is why the pages had none (test report M5, 16 Nov 2026).
# The API (/api) gets the same kind of headers from helmet in server/src/app.ts.
add_header X-Content-Type-Options nosniff always;
# Nobody can show the app inside another website (stops "clickjacking", e.g. on the reset-password page).
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
# Browsers always use https for this site (one year).
add_header Strict-Transport-Security "max-age=31536000" always;
# Only the app's own files may run; nothing from other websites. Checked on 17 Nov 2026: every screen, Print,
# Word and Excel downloads work with this policy (no violations).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
