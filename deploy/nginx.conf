# Nginx site for Prasad Shoes. setup-server.sh replaces __DOMAIN__ and Certbot adds the HTTPS part.
# Website files: /var/www/prasad-shoes      API: Node.js on 127.0.0.1:3000

limit_req_zone $binary_remote_addr zone=ps_login:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/prasad-shoes;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Login: max 10 requests per second per IP (plus the 5-tries lock inside the app)
    location /api/auth/ {
        limit_req zone=ps_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;   # big Word files (500+ orders)
        proxy_buffering off;
    }

    # App files have a hash in their name, so they can be cached for a long time
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a screen of the app (single-page website)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
